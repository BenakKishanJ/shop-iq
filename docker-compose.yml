# ShopIQ — backend + Postgres for Day 7 deployment prep.
#
#   docker compose up --build     # start db + backend
#   curl localhost:8000/api/health
#
# Values fall back to sensible defaults; real secrets come from .env
# (gitignored) via variable interpolation — nothing secret is in this file.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopiq}
      POSTGRES_DB: ${POSTGRES_DB:-shopiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopiq} -d ${POSTGRES_DB:-shopiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-shopiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopiq}
      POSTGRES_DB: ${POSTGRES_DB:-shopiq}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
