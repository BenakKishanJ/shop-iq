# ShopIQ — single-image stack: frontend (static) + backend + PostgreSQL + RAG.
#
#   docker compose up --build        # build + run the one container
#   open http://localhost:8000       # UI and /api are served by the same process
#
# Values fall back to sensible defaults; real secrets come from .env
# (gitignored) via variable interpolation — nothing secret is in this file.

services:
  shopiq:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Embedded PostgreSQL lives in this container (127.0.0.1).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-shopiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopiq}
      POSTGRES_DB: ${POSTGRES_DB:-shopiq}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Persist the embedded database across container restarts.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
